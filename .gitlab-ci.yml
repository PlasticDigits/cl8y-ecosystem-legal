# Run on MR events and branch pushes (ensures test:rust / test:e2e are not skipped).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - lint
  - test
  - build

lint:gitleaks:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose --redact

variables:
  DATABASE_URL: postgres://cl8y_legal:cl8y_legal@postgres:5432/cl8y_legal
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

.rust:
  image: rust:1.83-bookworm
  before_script:
    - apt-get update && apt-get install -y pkg-config libssl-dev
    - cd api

.rust-bot:
  image: rust:1.83-bookworm
  before_script:
    - cd bot

lint:rust:
  extends: .rust
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

lint:rust-bot:
  extends: .rust-bot
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy -- -D warnings

test:rust:
  extends: .rust
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: cl8y_legal
    POSTGRES_PASSWORD: cl8y_legal
    POSTGRES_DB: cl8y_legal
  script:
    - cargo test

# Bot unit tests (fail-closed compliance, config parsing). No Postgres required.
test:rust-bot:
  extends: .rust-bot
  stage: test
  script:
    - cargo test

test:clickwrap:
  stage: test
  image: node:22-bookworm
  script:
    - npm ci
    - npm run test:sdk

test:web:
  stage: test
  image: node:22-bookworm
  script:
    - npm ci
    - npm run build:sdk
    - npm run test:web

test:e2e:
  extends: .rust
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: cl8y_legal
    POSTGRES_PASSWORD: cl8y_legal
    POSTGRES_DB: cl8y_legal
    DATABASE_URL: postgres://cl8y_legal:cl8y_legal@postgres:5432/cl8y_legal
    PLAYWRIGHT_API_BASE: http://127.0.0.1:8080
    CORS_ORIGINS: http://127.0.0.1:5173
    LEGAL_PUBLIC_BASE_URL: http://127.0.0.1:5173
    ALLOW_LOCALHOST_PROPERTY: "true"
    TERMS_SYNC_ON_STARTUP: "false"
    ADMIN_TOKEN: test-admin
    TRUSTED_PROXY_CIDRS: ""
    TELEGRAM_BOT_TOKEN: "123456:ABC-DEF"
    RATE_LIMIT_READ: "1000"
    RATE_LIMIT_WRITE: "1000"
  before_script:
    - apt-get update && apt-get install -y pkg-config libssl-dev curl
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - cd api
  script:
    - cargo build
    - test -x target/debug/cl8y-legal-api
    - cd ..
    - npm ci
    - npm run build:sdk
    - npm run test:web
    - cd web
    - npx playwright install --with-deps chromium
    - npm run test:e2e

build:release:
  extends: .rust
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - api/target/release/cl8y-legal-api
    expire_in: 1 week

build:bot:
  extends: .rust-bot
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - bot/target/release/cl8y-terms-bot
    expire_in: 1 week

build:clickwrap:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci
    - npm run build:sdk
  artifacts:
    paths:
      - packages/cl8y-clickwrap/dist/
    expire_in: 1 week

build:web:
  stage: build
  image: node:22-bookworm
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week
