stages:
  - lint
  - test
  - build

lint:gitleaks:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  DATABASE_URL: postgres://cl8y_legal:cl8y_legal@postgres:5432/cl8y_legal
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

.rust:
  image: rust:1.83-bookworm
  before_script:
    - apt-get update && apt-get install -y pkg-config libssl-dev
    - cd api

lint:rust:
  extends: .rust
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

test:rust:
  extends: .rust
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: cl8y_legal
    POSTGRES_PASSWORD: cl8y_legal
    POSTGRES_DB: cl8y_legal
  script:
    - cargo test

test:web:
  stage: test
  image: node:22-bookworm
  script:
    - cd web
    - npm ci
    - npm run test
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  variables:
    VITE_API_BASE_URL: http://localhost:8080

build:release:
  extends: .rust
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - api/target/release/cl8y-legal-api
    expire_in: 1 week

build:web:
  stage: build
  image: node:22-bookworm
  script:
    - cd web
    - npm ci
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 week
